# Između satnih osvježavanja vijesti: svakih 15 minuta osvježi nogometne rezultate.
# Objavljuje se samo kad se rezultat ili tablica promijeni.
name: Nogometni rezultati

on:
  schedule:
    - cron: '22,37,52 * * * *'   # u 7. minuti rezultate osvježava satni posao vijesti
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ista grupa kao satni posao, da se dvije objave nikad ne preklope.
concurrency:
  group: osvjezavanje
  cancel-in-progress: false

jobs:
  rezultati:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - id: nogomet
        name: Osvježi rezultate
        run: node pipeline/nogomet.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - if: steps.nogomet.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        if: steps.nogomet.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
